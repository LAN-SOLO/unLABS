name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      # Fallback placeholders keep the build green when repo secrets are
      # not configured. `lib/env.ts` validates min(1); `next build`
      # prerenders pages that import the env so an empty string fails the
      # whole build. The real values matter only when the e2e job actually
      # talks to Supabase — until then a non-empty placeholder is enough.
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.CI_SUPABASE_ANON_KEY || 'ci-placeholder-anon-key' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.CI_SUPABASE_SERVICE_ROLE_KEY || 'ci-placeholder-service-role-key' }}
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      # No `version:` here — action-setup@v4 errors when both a `version`
      # input AND a `packageManager` field in package.json are set. The
      # action reads `packageManager: "pnpm@9.15.0"` from package.json
      # instead, which keeps CI in lockstep with what the project pins.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

  migrations:
    name: Supabase migrations apply cleanly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - run: supabase db reset
      - run: supabase db lint

  e2e:
    name: Playwright smoke
    needs: quality
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      # Fallback placeholders keep the build green when repo secrets are
      # not configured. `lib/env.ts` validates min(1); `next build`
      # prerenders pages that import the env so an empty string fails the
      # whole build. The real values matter only when the e2e job actually
      # talks to Supabase — until then a non-empty placeholder is enough.
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.CI_SUPABASE_ANON_KEY || 'ci-placeholder-anon-key' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.CI_SUPABASE_SERVICE_ROLE_KEY || 'ci-placeholder-service-role-key' }}
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      # No `version:` here — action-setup@v4 errors when both a `version`
      # input AND a `packageManager` field in package.json are set. The
      # action reads `packageManager: "pnpm@9.15.0"` from package.json
      # instead, which keeps CI in lockstep with what the project pins.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
