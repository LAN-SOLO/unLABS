pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.{ts,tsx,js,jsx,mjs,json,md,css}"
      run: pnpm prettier --write {staged_files} && git add {staged_files}
    lint:
      glob: "*.{ts,tsx,js,jsx,mjs}"
      run: pnpm eslint --fix {staged_files} && git add {staged_files}
    typecheck:
      glob: "*.{ts,tsx}"
      run: pnpm typecheck

pre-push:
  commands:
    test:
      run: pnpm test
